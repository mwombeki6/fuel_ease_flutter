openapi: 3.0.3
info:
  title: FuelEase API
  description: |
    Comprehensive API for the FuelEase Fuel Digital Card System - a nationwide digital fuel management
    and dispensing ecosystem designed for Tanzania. The system integrates customers, fuel stations,
    and national regulators under a unified digital framework.

    ## Features
    - Password-based authentication with JWT
    - Role-based access control (Customer, Station Admin, Station Manager, Regulator, System Admin)
    - Digital fuel dispensing with QR codes and numeric tokens
    - Real-time pump monitoring
    - Regulatory compliance and oversight
    - Analytics and reporting

    ## Authentication
    Most endpoints require JWT authentication. Include the token in the Authorization header:
    ```
    Authorization: Bearer <your-jwt-token>
    ```
  version: 1.0.0
  contact:
    name: FuelEase API Support
    email: support@fuelease.com
  license:
    name: Proprietary

servers:
  - url: https://fuel-ease-api.mwombekilubere.workers.dev/api
    description: Production server (Cloudflare Workers)
  - url: http://localhost:8787/api
    description: Local development server

tags:
  - name: Authentication
    description: User authentication and session management
  - name: Users
    description: User account management
  - name: Mobile
    description: Mobile app / customer-specific endpoints
  - name: Organizations
    description: Organization management for fleet operators
  - name: Fuel Cards
    description: Digital fuel card management
  - name: Dispensing
    description: Fuel dispensing requests and tokens
  - name: Stations
    description: Fuel station management
  - name: Pumps
    description: Fuel pump management and monitoring
  - name: Inventory
    description: Station fuel inventory management
  - name: Purchase Orders
    description: Fuel purchase order workflow
  - name: Stock Alarms
    description: Low fuel stock alerts
  - name: Regulator
    description: Government regulatory oversight endpoints
  - name: Analytics
    description: Analytics and reporting
  - name: Wallet
    description: Digital wallet management
  - name: Payments
    description: Payment processing
  - name: Subscriptions
    description: Subscription management
  - name: WebSocket
    description: Real-time event streaming

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /users/login or /mobile/login

  schemas:
    # Common response schemas
    SuccessResponse:
      type: object
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          enum: [error]
        message:
          type: string
        errors:
          type: array
          items:
            type: object

    PaginatedResponse:
      type: object
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
        pagination:
          type: object
          properties:
            total:
              type: integer
            page:
              type: integer
            limit:
              type: integer
            pages:
              type: integer

    # User schemas
    User:
      type: object
      properties:
        id:
          type: string
          example: user_abc123
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [customer, station_admin, station_manager, regulator, system_admin]
        createdAt:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - firstName
        - lastName
        - phone
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
          pattern: '^\+255[67]\d{8}$'

    # Station schemas
    Station:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        zipCode:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        phone:
          type: string
        email:
          type: string
        managerId:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE, SUSPENDED]
        createdAt:
          type: integer
          format: int64

    CreateStationRequest:
      type: object
      required:
        - name
        - address
        - city
        - state
        - latitude
        - longitude
      properties:
        name:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        zipCode:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        phone:
          type: string
        email:
          type: string
        managerId:
          type: string

    # Pump schemas
    Pump:
      type: object
      properties:
        id:
          type: string
        stationId:
          type: string
        pumpNumber:
          type: integer
        fuelType:
          type: string
          enum: [REGULAR, PREMIUM, DIESEL, ELECTRIC, NATURAL_GAS]
        status:
          type: string
          enum: [ACTIVE, IDLE, MAINTENANCE, DISABLED]
        deviceId:
          type: string
        model:
          type: string
        manufacturer:
          type: string
        serialNumber:
          type: string
        installedAt:
          type: integer
          format: int64
        lastMaintenance:
          type: integer
          format: int64

    CreatePumpRequest:
      type: object
      required:
        - stationId
        - pumpNumber
        - fuelType
      properties:
        stationId:
          type: string
        pumpNumber:
          type: integer
        fuelType:
          type: string
          enum: [REGULAR, PREMIUM, DIESEL, ELECTRIC, NATURAL_GAS]
        deviceId:
          type: string
        model:
          type: string
        manufacturer:
          type: string
        serialNumber:
          type: string

    # Dispensing schemas
    DispensingRequest:
      type: object
      properties:
        id:
          type: string
        requesterId:
          type: string
        organizationId:
          type: string
        cardId:
          type: string
        stationId:
          type: string
        pumpId:
          type: string
        fuelType:
          type: string
        requestedLiters:
          type: number
        estimatedCostTsh:
          type: number
        status:
          type: string
          enum: [pending, approved, rejected, completed, cancelled, expired]
        qrToken:
          type: string
          description: Base64-encoded QR code image (data URL)
        numericToken:
          type: string
          description: 6-digit numeric token for manual entry
        tokenExpiresAt:
          type: integer
          format: int64
        actualLitersDispensed:
          type: number
        actualCostTsh:
          type: number
        createdAt:
          type: integer
          format: int64
        updatedAt:
          type: integer
          format: int64

    CreateDispensingRequest:
      type: object
      required:
        - stationId
        - fuelType
        - requestedLiters
      properties:
        stationId:
          type: string
        fuelType:
          type: string
          enum: [REGULAR, PREMIUM, DIESEL, ELECTRIC, NATURAL_GAS]
        requestedLiters:
          type: number
          minimum: 1
        cardId:
          type: string
        vehicleType:
          type: string
          enum: [motorcycle, car, van, three_wheel, truck, bus]
        vehicleMileageKm:
          type: number

    ApproveDispensingRequest:
      type: object
      properties:
        approvedLiters:
          type: number
        notes:
          type: string

    # Regulator schemas
    PumpLock:
      type: object
      properties:
        id:
          type: string
        pumpId:
          type: string
        imposedBy:
          type: string
        reason:
          type: string
        active:
          type: boolean
        imposedAt:
          type: integer
          format: int64
        liftedAt:
          type: integer
          format: int64

    StationSuspension:
      type: object
      properties:
        id:
          type: string
        stationId:
          type: string
        imposedBy:
          type: string
        status:
          type: string
          enum: [ACTIVE, LIFTED]
        reason:
          type: string
        notes:
          type: string
        imposedAt:
          type: integer
          format: int64
        liftedAt:
          type: integer
          format: int64

    PriceRule:
      type: object
      properties:
        id:
          type: string
        region:
          type: string
        fuelType:
          type: string
          enum: [REGULAR, PREMIUM, DIESEL, ELECTRIC, NATURAL_GAS]
        minPrice:
          type: number
        maxPrice:
          type: number
        notes:
          type: string
        createdBy:
          type: string
        createdAt:
          type: integer
          format: int64

    FuelPrediction:
      type: object
      properties:
        stationId:
          type: string
        stationName:
          type: string
        region:
          type: string
        fuelType:
          type: string
        historical:
          type: object
          properties:
            days:
              type: integer
            totalLitersDispensed:
              type: number
            transactionCount:
              type: integer
            avgLitersPerTransaction:
              type: number
            dailyAverage:
              type: number
        prediction:
          type: object
          properties:
            next7Days:
              type: number
            next30Days:
              type: number
            confidence:
              type: string
              enum: [high, medium, low]

  parameters:
    StationIdParam:
      name: stationId
      in: path
      required: true
      schema:
        type: string
      description: Station ID

    PumpIdParam:
      name: pumpId
      in: path
      required: true
      schema:
        type: string
      description: Pump ID

    UserIdParam:
      name: userId
      in: path
      required: true
      schema:
        type: string
      description: User ID

    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 100
        maximum: 1000
      description: Maximum number of results to return

    OffsetParam:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Number of results to skip

    RegionParam:
      name: region
      in: query
      schema:
        type: string
      description: Filter by region/state

    FuelTypeParam:
      name: fuelType
      in: query
      schema:
        type: string
        enum: [REGULAR, PREMIUM, DIESEL, ELECTRIC, NATURAL_GAS]
      description: Filter by fuel type

paths:
  # Authentication endpoints
  /users/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Create a new user account with password-based authentication
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      token:
                        type: string
                      expiresAt:
                        type: integer
                        format: int64
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/login:
    post:
      tags:
        - Authentication
      summary: Login user
      description: Authenticate with email and password to receive JWT token
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      user:
                        $ref: '#/components/schemas/User'
                      expiresAt:
                        type: integer
                        format: int64
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/logout:
    post:
      tags:
        - Authentication
      summary: Logout user
      description: Invalidate current session
      operationId: logoutUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /users/me:
    get:
      tags:
        - Users
      summary: Get current user profile
      description: Retrieve authenticated user's profile information
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Station endpoints
  /stations:
    get:
      tags:
        - Stations
      summary: List all stations
      description: |
        Get a list of all fuel stations. Authentication is optional.
        If authenticated with station_admin or station_manager role, can use ?owner=me filter.
      operationId: listStations
      parameters:
        - name: owner
          in: query
          schema:
            type: string
            enum: [me]
          description: Filter stations owned by the authenticated user (requires authentication)
        - name: city
          in: query
          schema:
            type: string
          description: Filter by city
        - $ref: '#/components/parameters/RegionParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, SUSPENDED]
          description: Filter by station status
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: List of stations
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      stations:
                        type: array
                        items:
                          $ref: '#/components/schemas/Station'
        '401':
          description: Authentication required when using owner=me filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Stations
      summary: Create a new station
      description: Create a new fuel station (requires station_admin or system_admin role)
      operationId: createStation
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStationRequest'
      responses:
        '201':
          description: Station created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      station:
                        $ref: '#/components/schemas/Station'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /stations/{stationId}:
    get:
      tags:
        - Stations
      summary: Get station details
      description: Retrieve detailed information about a specific station
      operationId: getStation
      parameters:
        - $ref: '#/components/parameters/StationIdParam'
      responses:
        '200':
          description: Station details retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      station:
                        $ref: '#/components/schemas/Station'
        '404':
          description: Station not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags:
        - Stations
      summary: Update station
      description: Update station information (requires appropriate permissions)
      operationId: updateStation
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StationIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                address:
                  type: string
                city:
                  type: string
                state:
                  type: string
                phone:
                  type: string
                email:
                  type: string
      responses:
        '200':
          description: Station updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      station:
                        $ref: '#/components/schemas/Station'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Station not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Pump endpoints
  /pumps:
    post:
      tags:
        - Pumps
      summary: Create a new pump
      description: Add a new fuel pump to a station
      operationId: createPump
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePumpRequest'
      responses:
        '201':
          description: Pump created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      pump:
                        $ref: '#/components/schemas/Pump'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /pumps/{pumpId}:
    get:
      tags:
        - Pumps
      summary: Get pump details
      description: Retrieve detailed information about a specific pump
      operationId: getPump
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PumpIdParam'
      responses:
        '200':
          description: Pump details retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      pump:
                        $ref: '#/components/schemas/Pump'
        '404':
          description: Pump not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Dispensing endpoints
  /dispensing-requests:
    get:
      tags:
        - Dispensing
      summary: List dispensing requests
      description: Get list of dispensing requests (filtered by user role)
      operationId: listDispensingRequests
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected, completed, cancelled, expired]
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: List of dispensing requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      requests:
                        type: array
                        items:
                          $ref: '#/components/schemas/DispensingRequest'

    post:
      tags:
        - Dispensing
      summary: Create dispensing request
      description: Create a new fuel dispensing request
      operationId: createDispensingRequest
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDispensingRequest'
      responses:
        '201':
          description: Dispensing request created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      request:
                        $ref: '#/components/schemas/DispensingRequest'

  /dispensing-requests/{requestId}/approve:
    patch:
      tags:
        - Dispensing
      summary: Approve dispensing request
      description: Approve a pending dispensing request and generate QR/numeric tokens
      operationId: approveDispensingRequest
      security:
        - BearerAuth: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveDispensingRequest'
      responses:
        '200':
          description: Request approved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      request:
                        $ref: '#/components/schemas/DispensingRequest'

  # Regulator endpoints
  /regulator/dispensing:
    get:
      tags:
        - Regulator
      summary: List dispensing transactions
      description: Get dispensing transactions for regulatory monitoring
      operationId: listDispensingTransactions
      security:
        - BearerAuth: []
      parameters:
        - name: stationId
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/RegionParam'
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: dateTo
          in: query
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/FuelTypeParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: List of dispensing transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      dispensing:
                        type: object
                        properties:
                          transactions:
                            type: array
                            items:
                              type: object
                          count:
                            type: integer
                          limit:
                            type: integer
                          offset:
                            type: integer
        '403':
          description: Forbidden - requires regulator role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /regulator/fuel-prediction:
    get:
      tags:
        - Regulator
      summary: Get fuel availability predictions
      description: Get fuel consumption predictions based on historical data
      operationId: getFuelPrediction
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RegionParam'
        - name: stationId
          in: query
          schema:
            type: string
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 7
          description: Historical window in days
      responses:
        '200':
          description: Fuel prediction data
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      prediction:
                        type: object
                        properties:
                          predictions:
                            type: array
                            items:
                              $ref: '#/components/schemas/FuelPrediction'
                          analysisWindow:
                            type: object
                          summary:
                            type: object

  /regulator/pumps/{pumpId}/lock:
    post:
      tags:
        - Regulator
      summary: Lock a pump
      description: Lock a pump for regulatory compliance
      operationId: lockPump
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PumpIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 300
      responses:
        '201':
          description: Pump locked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      lock:
                        $ref: '#/components/schemas/PumpLock'

  /regulator/pumps/{pumpId}/unlock:
    post:
      tags:
        - Regulator
      summary: Unlock a pump
      description: Remove lock from a pump
      operationId: unlockPump
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PumpIdParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
                  maxLength: 300
      responses:
        '200':
          description: Pump unlocked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      lock:
                        $ref: '#/components/schemas/PumpLock'

  /regulator/stations/{stationId}/suspend:
    post:
      tags:
        - Regulator
      summary: Suspend a station
      description: Suspend a station for regulatory compliance
      operationId: suspendStation
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StationIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 300
                notes:
                  type: string
                  maxLength: 500
      responses:
        '201':
          description: Station suspended successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      suspension:
                        $ref: '#/components/schemas/StationSuspension'

  /regulator/stations/{stationId}/lift:
    post:
      tags:
        - Regulator
      summary: Lift station suspension
      description: Remove suspension from a station
      operationId: liftStationSuspension
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StationIdParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Station suspension lifted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      suspension:
                        $ref: '#/components/schemas/StationSuspension'

  /regulator/prices/rules:
    get:
      tags:
        - Regulator
      summary: List price rules
      description: Get all price enforcement rules
      operationId: listPriceRules
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of price rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      rules:
                        type: array
                        items:
                          $ref: '#/components/schemas/PriceRule'

    post:
      tags:
        - Regulator
      summary: Create price rule
      description: Create or update a price enforcement rule
      operationId: createPriceRule
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - region
                - fuelType
              properties:
                region:
                  type: string
                fuelType:
                  type: string
                  enum: [REGULAR, PREMIUM, DIESEL, ELECTRIC, NATURAL_GAS]
                minPrice:
                  type: number
                  minimum: 0
                maxPrice:
                  type: number
                  minimum: 0
                notes:
                  type: string
                  maxLength: 500
                stationId:
                  type: string
      responses:
        '201':
          description: Price rule created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Price rule saved
                  data:
                    type: object
                    properties:
                      rule:
                        $ref: '#/components/schemas/PriceRule'

  # WebSocket endpoint
  /ws/connect:
    get:
      tags:
        - WebSocket
      summary: WebSocket connection
      description: |
        Establish a WebSocket connection for real-time events.
        Upgrade from HTTP to WebSocket protocol.

        **Connection URL:** wss://fuel-ease-api.mwombekilubere.workers.dev/api/ws/connect

        After connecting, send an authentication message with your JWT token.
      operationId: connectWebSocket
      responses:
        '101':
          description: Switching protocols to WebSocket
        '401':
          description: Unauthorized

  /health:
    get:
      tags:
        - System
      summary: Health check
      description: Check API health status
      operationId: healthCheck
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: integer
                    format: int64
