openapi: 3.0.3
info:
  title: FuelEase API
  description: |
    API for the FuelEase Fuel Digital Card System — a nationwide digital fuel management
    and dispensing ecosystem for Tanzania. Integrates customers, fuel stations, regulators,
    and IoT pump devices under a unified digital framework.

    ## Base URL
    All endpoints are prefixed with `/api/v1`.

    ## Authentication
    Most endpoints require a JWT Bearer token obtained from `POST /api/v1/auth/login`.
    Include it in the `Authorization` header:
    ```
    Authorization: Bearer <access_token>
    ```

    Device endpoints use mTLS certificate fingerprint headers instead of JWT:
    - `X-Device-ID`: provisioned device identifier
    - `X-Cert-Fingerprint`: SHA-256 fingerprint of the client TLS certificate

    ## Roles
    - `customer` — fuel card holder, can request and cancel dispenses
    - `station_admin` — owns/manages a station, approves dispenses, manages pumps
    - `station_manager` — manages day-to-day station operations
    - `regulator` — government oversight; may be national (no region) or regional (region in JWT)
    - `system_admin` — full platform access

    ## Money
    All prices and balances are in Tanzanian Shillings (TZS) as integers. No decimals.

    ## Regional Scope
    Regulator endpoints automatically scope to the caller's JWT region when non-empty.
    `system_admin` callers may pass `?region=` to filter explicitly.
  version: 2.0.0
  contact:
    name: FuelEase API Support
    email: support@fuelease.com
  license:
    name: Proprietary

servers:
  - url: https://api.fuelease.co.tz/api/v1
    description: Production
  - url: http://localhost:8080/api/v1
    description: Local development

tags:
  - name: Authentication
    description: Registration, login, token refresh, logout
  - name: Users
    description: User profile management
  - name: Wallets
    description: Digital wallet balance and transactions
  - name: Cards
    description: Digital fuel card management
  - name: Companies
    description: Company / fleet operator management
  - name: Stations
    description: Fuel station CRUD and sub-resources
  - name: Dispense
    description: Fuel dispensing request lifecycle
  - name: Admin
    description: System administrator operations (system_admin only)
  - name: Analytics
    description: Dashboards and reporting
  - name: Regulator
    description: Government regulatory oversight
  - name: Device
    description: IoT pump device endpoints (cert-based auth, no JWT)
  - name: WebSocket
    description: Real-time event streaming for dashboards and devices
  - name: Organizations
    description: Organization / fleet management
  - name: Payments
    description: Wallet top-up and payment webhooks
  - name: System
    description: Health and readiness probes

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    PumpIdParam:
      name: pump_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100

    OffsetParam:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0

    RegionParam:
      name: region
      in: query
      schema:
        type: string
      description: |
        Region filter. For `regulator` callers this is ignored — their JWT region is always used.
        For `system_admin` callers this filters results to the specified region.

  schemas:
    # ── Shared ────────────────────────────────────────────────────────
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string

    # ── Users ─────────────────────────────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        phone:
          type: string
          nullable: true
        role:
          type: string
          enum: [customer, station_admin, station_manager, regulator, system_admin]
        status:
          type: string
          enum: [active, pending, suspended]
        region:
          type: string
          nullable: true
          description: Non-null only for regional regulators
        created_at:
          type: string
          format: date-time

    Tokens:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_at:
          type: string
          format: date-time

    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        tokens:
          $ref: '#/components/schemas/Tokens'
        session_id:
          type: string
          format: uuid

    # ── Wallets ───────────────────────────────────────────────────────
    Wallet:
      type: object
      properties:
        id:
          type: string
          format: uuid
        balance_tzs:
          type: integer
          format: int64
          description: Balance in TZS (integer, no decimals)
        status:
          type: string
          enum: [active, frozen]
        updated_at:
          type: string
          format: date-time

    WalletTransaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        wallet_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [credit, debit, hold, release]
        amount_tzs:
          type: integer
          format: int64
        balance_after:
          type: integer
          format: int64
        ref_id:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    # ── Cards ─────────────────────────────────────────────────────────
    FuelCard:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
          nullable: true
        card_number_last4:
          type: string
          description: Last 4 characters of the encrypted card number
        status:
          type: string
          enum: [active, blocked, expired]
        created_at:
          type: string
          format: date-time

    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        tin:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    # ── Stations ──────────────────────────────────────────────────────
    Station:
      type: object
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        region:
          type: string
          description: Tanzania region (e.g. "Dar es Salaam", "Mwanza")
        district:
          type: string
        ewura_code:
          type: string
          nullable: true
          description: Energy and Water Utilities Regulatory Authority licence code
        tra_code:
          type: string
          nullable: true
          description: Tanzania Revenue Authority code
        status:
          type: string
          enum: [pending, active, suspended]
        created_at:
          type: string
          format: date-time

    Pump:
      type: object
      properties:
        id:
          type: string
          format: uuid
        station_id:
          type: string
          format: uuid
        device_id:
          type: string
          nullable: true
          description: IoT device ID attached to this pump
        fuel_type:
          type: string
          enum: [petrol, diesel, premium, gas]
        status:
          type: string
          enum: [active, inactive, locked]
        created_at:
          type: string
          format: date-time

    FuelPrice:
      type: object
      properties:
        id:
          type: string
          format: uuid
        station_id:
          type: string
          format: uuid
        fuel_type:
          type: string
          enum: [petrol, diesel, premium, gas]
        price_tzs:
          type: integer
          format: int64
        is_active:
          type: boolean
        effective_from:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    FuelInventory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        station_id:
          type: string
          format: uuid
        fuel_type:
          type: string
          enum: [petrol, diesel, premium, gas]
        quantity_liters:
          type: number
          format: double
        capacity_liters:
          type: number
          format: double
          nullable: true
        low_level_alert_liters:
          type: number
          format: double
          nullable: true
        last_refill_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time

    # ── Dispensing ────────────────────────────────────────────────────
    DispensingRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        card_id:
          type: string
          format: uuid
        station_id:
          type: string
          format: uuid
        pump_id:
          type: string
          format: uuid
          nullable: true
        wallet_hold_id:
          type: string
          format: uuid
          nullable: true
        requested_liters:
          type: string
          description: Decimal string (e.g. "20.000")
        actual_liters:
          type: string
          nullable: true
        price_per_liter_tzs:
          type: integer
          format: int64
        status:
          type: string
          enum: [pending, approved, completed, cancelled, rejected, expired]
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true

    CreateDispenseResponse:
      type: object
      properties:
        request:
          $ref: '#/components/schemas/DispensingRequest'
        pin:
          type: string
          description: 6-digit numeric PIN for manual pump entry
        qr_payload:
          type: string
          description: JSON payload to encode as a QR code on the mobile app

    # ── Regulator ─────────────────────────────────────────────────────
    StationSuspension:
      type: object
      properties:
        id:
          type: string
          format: uuid
        station_id:
          type: string
          format: uuid
        suspended_by:
          type: string
          format: uuid
        reason:
          type: string
        notes:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, LIFTED]
          description: Uppercase plain-text column, not a DB enum
        suspended_at:
          type: string
          format: date-time
        lifted_at:
          type: string
          format: date-time
          nullable: true
        lifted_by:
          type: string
          format: uuid
          nullable: true
        station_name:
          type: string
        station_state:
          type: string
          description: Region of the station

    PumpLock:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pump_id:
          type: string
          format: uuid
        locked_by:
          type: string
          format: uuid
        reason:
          type: string
        notes:
          type: string
          nullable: true
        locked_at:
          type: string
          format: date-time
        lifted_at:
          type: string
          format: date-time
          nullable: true
        lifted_by:
          type: string
          format: uuid
          nullable: true

    PriceRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fuel_type:
          type: string
          enum: [petrol, diesel, premium, gas]
        scope:
          type: string
          enum: [national, regional, district]
        region:
          type: string
          nullable: true
        district:
          type: string
          nullable: true
        min_price:
          type: integer
          format: int64
          nullable: true
          description: Minimum price in TZS (inclusive)
        max_price:
          type: integer
          format: int64
          nullable: true
          description: Maximum price in TZS (inclusive)
        notes:
          type: string
          nullable: true
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time

    PriceOverview:
      type: object
      properties:
        region:
          type: string
        fuel_type:
          type: string
        avg_price:
          type: number
          format: double
        min_price:
          type: integer
          format: int64
        max_price:
          type: integer
          format: int64
        station_count:
          type: integer

    PriceOutlier:
      type: object
      properties:
        station_id:
          type: string
          format: uuid
        station_name:
          type: string
        region:
          type: string
        fuel_type:
          type: string
        price_tzs:
          type: integer
          format: int64
        regional_avg:
          type: number
          format: double
        deviation_pct:
          type: number
          format: double

    PumpTelemetry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        station_id:
          type: string
          format: uuid
        station_name:
          type: string
        station_state:
          type: string
          description: Region of the station
        fuel_type:
          type: string
        status:
          type: string
          enum: [active, inactive, locked]
        device_id:
          type: string
          nullable: true
        connected:
          type: boolean
          nullable: true
        last_heartbeat:
          type: string
          format: date-time
          nullable: true
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    RegulatorAuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        action:
          type: string
          example: suspend_station
        target_type:
          type: string
          example: station
        target_id:
          type: string
        station_id:
          type: string
          format: uuid
          nullable: true
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    FuelPrediction:
      type: object
      properties:
        station_id:
          type: string
          format: uuid
        station_name:
          type: string
        region:
          type: string
        fuel_type:
          type: string
        historical:
          type: object
          properties:
            days:
              type: integer
            total_liters_dispensed:
              type: number
            transaction_count:
              type: integer
            avg_liters_per_transaction:
              type: number
            daily_average:
              type: number
        prediction:
          type: object
          properties:
            next_7_days:
              type: number
            next_30_days:
              type: number
            confidence:
              type: string
              enum: [high, medium, low]

    # ── Organization ──────────────────────────────────────────────────
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        owner_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

# ─────────────────────────────────────────────────────────────────────
# Paths
# ─────────────────────────────────────────────────────────────────────
paths:

  # ── System ────────────────────────────────────────────────────────
  /healthz:
    get:
      tags: [System]
      summary: Liveness probe
      description: Returns 200 if the process is alive. No dependency checks.
      operationId: healthz
      responses:
        '200':
          description: Process alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /ready:
    get:
      tags: [System]
      summary: Readiness probe
      description: Checks database and Redis connectivity. Returns 503 if either is unavailable.
      operationId: ready
      responses:
        '200':
          description: All dependencies healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  checks:
                    type: object
                    properties:
                      database:
                        type: string
                        example: ok
                      redis:
                        type: string
                        example: ok
        '503':
          description: One or more dependencies unavailable

  # ── Authentication ────────────────────────────────────────────────
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a new customer account
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, first_name, last_name]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                first_name:
                  type: string
                last_name:
                  type: string
                phone:
                  type: string
      responses:
        '201':
          description: Account created — returns auth tokens and session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email already registered

  /auth/login:
    post:
      tags: [Authentication]
      summary: Login and obtain JWT tokens
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials or account not active

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Exchange refresh token for a new token pair
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, refresh_token]
              properties:
                session_id:
                  type: string
                  format: uuid
                refresh_token:
                  type: string
      responses:
        '200':
          description: New token pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid or expired session

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout — invalidate session and revoke access token
      operationId: logout
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id:
                  type: string
                  format: uuid
      responses:
        '204':
          description: Logged out successfully
        '401':
          description: Unauthorized

  # ── Users ─────────────────────────────────────────────────────────
  /users/me:
    get:
      tags: [Users]
      summary: Get authenticated user profile
      operationId: getMe
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized

    put:
      tags: [Users]
      summary: Update authenticated user profile
      operationId: updateProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name]
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                phone:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/me/push-token:
    post:
      tags: [Users]
      summary: Register or update a Firebase push notification token
      operationId: registerPushToken
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token:
                  type: string
                  description: Firebase Cloud Messaging device token
                platform:
                  type: string
                  enum: [ios, android]
      responses:
        '200':
          description: Token registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  registered:
                    type: boolean

  # ── Wallets ───────────────────────────────────────────────────────
  /wallets/me:
    get:
      tags: [Wallets]
      summary: Get wallet balance (created on first access)
      operationId: getWallet
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Wallet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'

  /wallets/me/transactions:
    get:
      tags: [Wallets]
      summary: List wallet transactions (newest first)
      operationId: listTransactions
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Transaction list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WalletTransaction'

  /wallets/me/credit:
    post:
      tags: [Wallets]
      summary: Credit a user's wallet (system_admin only)
      operationId: creditWallet
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, amount_tzs]
              properties:
                user_id:
                  type: string
                  format: uuid
                  description: Target user whose wallet to credit
                amount_tzs:
                  type: integer
                  format: int64
                  minimum: 1
                ref_id:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Updated wallet after credit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '403':
          description: Forbidden — system_admin only

  /wallets/me/topup:
    post:
      tags: [Payments]
      summary: Initiate a wallet top-up via AzamPay
      operationId: initiateTopUp
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_tzs, phone]
              properties:
                amount_tzs:
                  type: integer
                  format: int64
                  minimum: 500
                phone:
                  type: string
                  description: Mobile money phone number (e.g. +255712345678)
      responses:
        '200':
          description: Top-up initiated — AzamPay will send a USSD prompt
          content:
            application/json:
              schema:
                type: object
                properties:
                  reference:
                    type: string
                    description: AzamPay transaction reference

  # ── Cards ─────────────────────────────────────────────────────────
  /cards:
    get:
      tags: [Cards]
      summary: List the authenticated user's fuel cards
      operationId: listCards
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Card list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FuelCard'

    post:
      tags: [Cards]
      summary: Register a new fuel card
      operationId: registerCard
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [card_number]
              properties:
                card_number:
                  type: string
                  description: Full card number (encrypted server-side; only last 4 stored in plain text)
                company_id:
                  type: string
                  format: uuid
                  nullable: true
      responses:
        '201':
          description: Card registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FuelCard'
        '409':
          description: Duplicate card number

  /cards/{id}:
    get:
      tags: [Cards]
      summary: Get a fuel card by ID
      operationId: getCard
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Fuel card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FuelCard'
        '404':
          description: Not found

  /cards/{id}/status:
    put:
      tags: [Cards]
      summary: Update card status (system_admin only)
      operationId: updateCardStatus
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
