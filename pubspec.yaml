name: fuel_ease_flutter
description: "FuelEase mobile app - Flutter version"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.6.2

  # HTTP & API
  dio: ^5.4.3
  retrofit: ^4.4.1
  pretty_dio_logger: ^1.4.0

  # Code Generation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # UI Components
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2

  # Animations
  lottie: ^3.1.2
  confetti: ^0.7.0

  # Charts & Visualization
  fl_chart: ^0.69.2

  # Permissions
  permission_handler: ^11.3.1

  # Push Notifications
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.5

  # Utilities
  intl: ^0.20.0
  equatable: ^2.0.7
  dartz: ^0.10.1
  connectivity_plus: ^6.1.1
  package_info_plus: ^8.1.2

  # Logging
  logger: ^2.5.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  retrofit_generator: ^9.1.4
  riverpod_generator: ^2.4.3

  # Testing
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
